# Stage 6 on the 10 dev participants: streaming recognition with event metrics.
# Per target session a stream is spliced from its test trials 4-7 (rest -> gesture 1-2 s -> rest 2-4 s -> ...,
# joined by equal-power crossfades),
# filtered causally in one pass and classified every 50 ms by two models calibrated with the stage-5 recipe
# (3 passes x 1 s from trials 1-3): a personal LDA (log + shrink) and the pretrained TCN + AdaBN + fine-tuning.
# E2 = new day (base TCN on own session 1), E3 = new person (5 folds by people, as adapt_tcn_dev).
# Post-processing (smoothing, threshold, minimum duration, refractory period) is swept; the operating point is
# chosen here and frozen for stream_test.
name: stream_dev
experiment: stream
participants: dev          # from configs/splits.yaml (10 people)
seed: 42                   # E3 folds and the stream order / pieces
cross_subject: kfold
n_folds: 5
experiments: [E2, E3]
epochs: {E2: 36, E3: 36}   # base TCNs: stage-4 recipe, cached by adapt_tcn_dev

preprocess:                # identical to adapt_tcn_dev (shared caches)
  band_hz: [20, 450]
  order: 4
  notch_hz: []
  warmup_ms: 200
  decimate: 2

windows:
  window_ms: 200
  step_ms: 50

features:
  zc_thr_mv: 0.01
  ssc_thr_mv: 0.01

model:
  channels: 64
  kernel: 3
  dilations: [1, 2, 4, 8, 16, 20]
  dropout: 0.0

train:
  crop_ms: 1200
  crops_per_trial: 4
  batch: 64
  lr: 0.001
  weight_decay: 0.01

calibration: {budget: 3x1}                 # first 1 s of every gesture in trials 1, 2, 3
calib_trials: 3
lda: {solver: lsqr, shrinkage: auto}       # personal LDA on the calibration
tcn_adapt: {unlabeled: adabn, finetune: full, lr: 0.0001, steps: 200}

stream:
  trials: [4, 5, 6, 7]     # test trials only; trials 1-3 are the calibration
  gesture_s: [1.0, 2.0]    # each gesture piece: random duration in this range
  rest_s: [2.0, 4.0]       # each rest gap
  lead_s: 3.0              # rest at the start, not scored (filter and model warm-up)
  rise_ms: 50              # equal-power crossfade rest -> gesture (contraction build-up; onset = its start)
  fall_ms: 50              # crossfade gesture -> rest (release; the gesture ends when it is over)
  join_ms: 20              # crossfades inside the rest pool (between rest trials and at its wrap)
  tol_ms: 500              # an event up to 0.5 s after the end of the fall still belongs to the gesture

grid:
  tau_ms: [0, 100, 250]            # smoothing time constant
  min_ms: [0, 100, 250]            # minimum time the class must stay above the threshold
  refractory_ms: [250, 750]        # minimum time between two commands
  theta: [0.3, 0.4, 0.5, 0.6, 0.7, 0.8, 0.85, 0.9, 0.95, 0.98]
fa_target_per_min: 1.0     # operating point: most correct commands with <= 1 false activation per minute of rest
extra_max_per_gesture: 0.1 # ... and <= 0.1 extra (repeated) commands per gesture

labels:
  lda: своя LDA, 3×1
  tcn: предобученная TCN, 3×1
