# Stage 7, TCN on the 10 dev participants, E3 (new person) with the stage-5 recipe: base network on the other
# people (5 folds of 2, as in adapt_tcn_dev), calibration 3x1 (first 1 s of every gesture in trials 1-3), test on
# trials 4-7 of every target session.
#   rotation  the target session (calibration and test) seen through a bracelet turned by -1 / 0 / +1 electrode
#             positions (60 degrees); base trained as is (stage-5 networks, cached) or with every training crop
#             turned by a random -1 / 0 / +1 (new networks, ~1 h)
#   failure   plain base, after the calibration 1 or 2 wrist channels fail on the test trials (all 12, all 66
#             pairs): flat line, or noise of a normal amplitude without EMG
name: robust_tcn_dev
experiment: robust_tcn
participants: dev          # from configs/splits.yaml (10 people)
seed: 42                   # also fixes the E3 folds (same as adapt_tcn_dev)
cross_subject: kfold
n_folds: 5
experiments: [E3]
epochs: {E3: 36}

preprocess:                # identical to adapt_tcn_dev (shared caches)
  band_hz: [20, 450]
  order: 4
  notch_hz: []
  warmup_ms: 200
  decimate: 2

windows:
  window_ms: 200
  step_ms: 50

model:
  channels: 64
  kernel: 3
  dilations: [1, 2, 4, 8, 16, 20]   # receptive field 205 samples = 200 ms
  dropout: 0.0

train:
  crop_ms: 1200
  crops_per_trial: 4
  batch: 64
  lr: 0.001
  weight_decay: 0.01

bases:                     # overrides of `train`
  plain: {}
  rot_aug: {rotate: [-1, 0, 1]}

calibration: {budget: 3x1}
calib_trials: 3
methods:
  none: {}
  full: {unlabeled: adabn, finetune: full, lr: 0.0001, steps: 200}

rotation:
  shifts: [-1, 0, 1]

failure:
  base: plain
  n_failed: [1, 2]
  modes: [zero, noise]
  noise_rms_mv: 0.043      # median RMS of a wrist channel during gestures (stage 2, quality_dev)
  bank: 200                # noise traces to draw from
