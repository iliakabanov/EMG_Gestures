# FINAL run, E3 (across people): one model trained on all 10 dev participants (all sessions),
# tested on the 5 test participants (all sessions). Hyperparameters frozen on dev (leave-one-participant-out
# in baseline_dev_e3): LDA variant = log + shrink; LightGBM unchanged. Run once; nothing is tuned on these results.
name: baseline_test_e3
experiment: baseline
participants: dev+test     # load both groups: train = dev, test = test
seed: 42
cross_subject: holdout     # held-out participants = the `test` group of configs/splits.yaml
experiments: [E3]

preprocess:
  band_hz: [20, 450]
  order: 4
  notch_hz: []
  window_ms: 200
  step_ms: 50
  warmup_ms: 200

features:
  zc_thr_mv: 0.01
  ssc_thr_mv: 0.01

models:
  lda_log_shrink: {type: lda, solver: lsqr, shrinkage: auto, log_amp: true}
  lgbm: {n_estimators: 300, learning_rate: 0.05, num_leaves: 31, n_jobs: 16}
