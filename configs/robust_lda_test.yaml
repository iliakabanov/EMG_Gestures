# FINAL run of stage 7, LDA (log + shrink), on the 5 test participants. Everything is frozen on dev (robust_lda_dev):
# the same parts and settings, and the greedy drop order chosen there (no search on test).
#   channels  E1 (trials 1-5 -> 6-7) on channel sets: 12 wrist, each wrist ring (6), 16 forearm, all 28
#   greedy    E1, the 12 wrist channels removed one by one in the dev order
#   rates     E1 at 2048 / 1024 / 512 / 256 Hz: causal Butterworth anti-alias low-pass (order 8) at 0.4 x new rate,
#             every k-th sample, band-pass 20 Hz .. min(450, 0.4 x new rate) recomputed for the new rate
#   rotation  E2 without calibration (own session-1 model), sessions 2-3 seen through a bracelet turned by
#             -1 / 0 / +1 electrode positions; trained as is or on session 1 stacked with its +-1 rotated copies
#   failure   E1, 1 or 2 wrist channels fail on the test trials (all 12, all 66 pairs): flat line, or noise
#             of a normal amplitude without EMG; plus the model retrained without the failed channels
# Run once; nothing is tuned on these results.
name: robust_lda_test
experiment: robust_lda
participants: test         # from configs/splits.yaml (5 people)
seed: 42

preprocess:                # as in stages 3-6 (the wrist feature cache is shared)
  band_hz: [20, 450]
  order: 4
  notch_hz: []
  window_ms: 200
  step_ms: 50
  warmup_ms: 200

features:
  zc_thr_mv: 0.01
  ssc_thr_mv: 0.01

lda: {solver: lsqr, shrinkage: auto}

channel_sets: [wrist, ring3, ring4, forearm, forearm_wrist]
greedy:                    # frozen: results/robust_lda_dev.json, greedy_order (first removed first)
  order: [W12, W9, W7, W11, W2, W10, W8, W5, W3, W1, W6, W4]

rates:
  downsample: [1, 2, 4, 8] # 2048, 1024, 512, 256 Hz
  antialias_ratio: 0.4
  antialias_order: 8

rotation:
  shifts: [-1, 0, 1]
  train_shifts:
    plain: [0]
    rot_aug: [-1, 0, 1]

failure:
  n_failed: [1, 2]
  modes: [zero, noise]
  noise_rms_mv: 0.043      # median RMS of a wrist channel during gestures (stage 2, quality_dev)
