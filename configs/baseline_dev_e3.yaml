# Stage 3 models on the 10 dev participants, E3 (across people): 10 splits, leave-one-participant-out —
# train on the other 9 (all sessions), test on the held-out one (all sessions). This is the cross-validation
# by people used for tuning; the final E3 model trains on all 10 dev and is tested on the test participants.
name: baseline_dev_e3
experiment: baseline
participants: dev          # from configs/splits.yaml (10 people)
seed: 42
cross_subject: lopo
experiments: [E3]

preprocess:
  band_hz: [20, 450]
  order: 4
  notch_hz: []
  window_ms: 200
  step_ms: 50
  warmup_ms: 200

features:
  zc_thr_mv: 0.01
  ssc_thr_mv: 0.01

models:
  lda: {}
  lda_shrink: {type: lda, solver: lsqr, shrinkage: auto}
  lda_log: {type: lda, log_amp: true}
  lda_log_shrink: {type: lda, solver: lsqr, shrinkage: auto, log_amp: true}
  lgbm: {n_estimators: 300, learning_rate: 0.05, num_leaves: 31, n_jobs: 16}
